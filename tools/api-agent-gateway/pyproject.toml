[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-agent-gateway"
version = "0.1.0"
description = "Confined, audited agent loop for API-only chat models (phase 1)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
