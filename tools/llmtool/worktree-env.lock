# 3.9 / 3.13 / 3.14 on macOS x86_64 + arm64 and manylinux x86_64 + aarch64 (plus
# pure py3 wheels). Any other platform/ABI has no pinned digest and fails closed;
# add its PyPI digest here (reviewed) to support it.
