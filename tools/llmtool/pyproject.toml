[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtool"
version = "0.1.0"
description = "Read-only CLI wrapper for the company Qwen gateway"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
llmtool = "llmtool.cli:main"

[tool.setuptools.packages.find]
include = ["llmtool*"]
