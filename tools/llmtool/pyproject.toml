[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtool"
version = "0.1.0"
description = "Read-only, provider-agnostic LLM CLI foundation"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
# Opt-in `llmtool chat --tui` only; the default line chat never imports it.
tui = ["prompt-toolkit>=3.0.52,<3.1"]

[project.scripts]
llmtool = "llmtool.entrypoint:main"

[tool.setuptools.packages.find]
include = ["llmtool*"]
namespaces = false

[tool.setuptools.package-data]
llmtool = ["skills/*/SKILL.md"]

[tool.setuptools.data-files]
llmtool = ["worker-dispatch.json"]
