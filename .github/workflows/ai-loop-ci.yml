name: ai-loop helper CI

on:
  push:
    branches:
      - automation/ai-loop
    paths:
      - 'scripts/ai_loop.py'
      - 'scripts/ai_loop_maintenance.py'
      - 'scripts/test_ai_loop_maintenance.py'
      - 'scripts/test_ai_loop.py'
      - 'scripts/ai-loop.sh'
      - 'automation/ai-loop/**'
      - 'skills/ai-loop-handoff/**'
      - '.github/workflows/ai-loop-ci.yml'
  pull_request:
    paths:
      - 'scripts/ai_loop.py'
      - 'scripts/test_ai_loop.py'
      - 'scripts/ai-loop.sh'
      - 'automation/ai-loop/**'
      - 'skills/ai-loop-handoff/**'
      - '.github/workflows/ai-loop-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax
        run: python -m py_compile scripts/ai_loop.py scripts/test_ai_loop.py scripts/ai_loop_maintenance.py scripts/test_ai_loop_maintenance.py
      - name: Bash launcher syntax
        run: bash -n scripts/ai-loop.sh
      - name: Offline helper regression suite
        run: python scripts/test_ai_loop.py

      - name: Offline maintenance safety regression suite
        run: python scripts/test_ai_loop_maintenance.py
