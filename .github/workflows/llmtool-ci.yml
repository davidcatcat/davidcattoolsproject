name: llmtool CI

on:
  push:
    paths:
      - 'tools/llmtool/**'
      - '.github/workflows/llmtool-ci.yml'
  pull_request:
    paths:
      - 'tools/llmtool/**'
      - '.github/workflows/llmtool-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install llmtool
        run: |
          python -m pip install --requirement tools/llmtool/requirements-ci.txt
          python -m pip install --no-deps -e tools/llmtool
      - name: Offline canonical checks
        run: make -C tools/llmtool check
      - name: Working tree is clean
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "::error::the CI run changed tracked files or left untracked files:"
            printf '%s\n' "$status"
            exit 1
          fi
          echo "working tree clean"
