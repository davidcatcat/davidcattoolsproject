          src_exe="$("$PYTHON_SRC" -c 'import os,sys; print(os.path.realpath(sys.executable))')" || fail "cannot query interpreter"
          dst="$RUNNER_TEMP/job-python-$PHASE"
          test ! -e "$dst" || fail "runtime root already exists"
          cp -a "$src" "$dst"
          chmod -R go-w "$dst"
          exe="$dst/${src_exe#"$src"/}"
          { test -f "$exe" && test ! -L "$exe"; } || fail "interpreter is not a regular file"
          test "$(stat -c %u "$exe")" = "$(id -u)" || fail "interpreter not owned by job user"
          test $(( 0$(stat -c %a "$exe") & 022 )) -eq 0 || fail "interpreter group/other writable"
          # Scan physical entries only; external symlink targets are not checked.
          # setup-python/cache libraries (including LD_LIBRARY_PATH) remain trusted;
          # executable verification does not prove full relocated runtime integrity.
          # BEGIN status-checked verification
          inventory=$(find "$dst" ! -type l -perm /022 -print -quit) || fail "cannot scan copy"
          test -z "$inventory" || fail "writable file left in copy"
