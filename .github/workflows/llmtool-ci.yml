                      result = subprocess.run(
                          ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c',
                           fail + '\n' + override + '\n' + guard],
                          env={**os.environ, 'dst': str(dst), 'exe': str(exe),
                               'src_exe': str(source)}, capture_output=True, text=True, timeout=10)
                      if expected is None:
                          assert result.returncode == 0, label
                      else:
                          assert result.returncode == 1, label
                          assert 'job-owned Python check failed: ' + expected in result.stdout, label
                          if unreadable:
                              assert 'Permission denied' in result.stderr, label
                      print(label + ': PASS')
                  finally:
                      for path in unreadable:
                          path.chmod(0o600)
          print('Verifier checks: 12/12 PASS; no skips')
          PY
      - name: Offline canonical checks (3.14)
        id: suite_314
        if: ${{ !cancelled() && steps.verifier_314.outcome == 'success' }}
        working-directory: src-3.14
        timeout-minutes: 13
        env:
          PHASE: '3.14'
          JOB_PYTHON: ${{ steps.runtime_314.outputs.exe }}
        run: |
          if [ "$INJECT_FAILURE" = "$PHASE" ]; then
            echo "::error::workflow_dispatch fail-closed self-test: injected Python $PHASE failure"
            exit 1
          fi
          make -C tools/llmtool check PYTHON="$JOB_PYTHON"
      - name: Working tree is clean (3.14)
        id: clean_314
        if: ${{ !cancelled() && steps.suite_314.outcome == 'success' }}
        working-directory: src-3.14
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "::error::the CI run changed tracked files or left untracked files:"
            printf '%s\n' "$status"
            exit 1
          fi
          echo "working tree clean"

      - name: Both interpreters passed
        if: ${{ always() }}
        env:
          RESULT_39: ${{ steps.clean_39.outcome }}
          RESULT_314: ${{ steps.clean_314.outcome }}
        run: |
          printf '| Python | complete checks |\n|---|---|\n| 3.9 | %s |\n| 3.14 | %s |\n' \
            "${RESULT_39:-missing}" "${RESULT_314:-missing}" >> "$GITHUB_STEP_SUMMARY"
          echo "Python 3.9: ${RESULT_39:-missing}; Python 3.14: ${RESULT_314:-missing}"
          if [ "$RESULT_39" != success ] || [ "$RESULT_314" != success ]; then
            echo "::error::both Python 3.9 and 3.14 must pass every required check"
            exit 1
          fi
