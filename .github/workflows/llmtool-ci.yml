              assert s.get('if') == want, s['name'] + ': 3.14 phase condition'
              previous = s['id']
          assert final.get('name') == 'Both interpreters passed' and final.get('if') == expr('always()')
          assert final['env'] == {'RESULT_39': expr('steps.clean_39.outcome'),
                                  'RESULT_314': expr('steps.clean_314.outcome')}, 'final gate inputs'
          assert first[-1]['id'] == 'clean_39' and second[-1]['id'] == 'clean_314'
          source = Path('.github/workflows/llmtool-ci.yml').read_text()
          assert 'GITHUB_' + 'ENV' not in source, 'state must not cross phases through the job environment'
          assert all('continue-on-error' not in s for s in steps), 'no step may hide a failure'
          print('Workflow structure checks: PASS')

