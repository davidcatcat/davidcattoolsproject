name: llmtool CI

on:
  push:
    paths:
      - 'tools/llmtool/**'
      - '.github/workflows/llmtool-ci.yml'
  pull_request:
    paths:
      - 'tools/llmtool/**'
      - '.github/workflows/llmtool-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install llmtool
        run: python -m pip install -e tools/llmtool
      - name: Offline canonical checks
        run: make -C tools/llmtool check
