name: llmtool CI

# Feature branches are tested through their pull request, not again on push:
# a branch push plus its PR used to run the same commit twice (Issue #99).
# main keeps its post-merge run; workflow_dispatch is the explicit manual
# check for a ref without a PR.
on:
  push:
    branches:
      - main
    paths:
      - 'tools/llmtool/**'
      - '.github/workflows/llmtool-ci.yml'
  pull_request:
    paths:
      - 'tools/llmtool/**'
      - '.github/workflows/llmtool-ci.yml'
  workflow_dispatch:
    inputs:
      inject_failure:
        description: 'Fail-closed self-test: force this interpreter phase to fail (can only make a run fail)'
        type: choice
        options: ['none', '3.9', '3.14']
        default: 'none'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The commit under test. For pull_request this is the PR's own head commit,
  # not GitHub's temporary merge commit (GITHUB_SHA); push and dispatch test
  # the event commit. Runs are therefore exact-head evidence for that SHA.
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  INJECT_FAILURE: ${{ inputs.inject_failure || 'none' }}
  PIP_NO_CACHE_DIR: '1'

# One job runs the complete checks for Python 3.9 and then 3.14, so the run is
# billed as one rounded-up job instead of two (Issue #99). Each interpreter has
# its own checkout, job-owned runtime copy and step outputs; nothing is passed
# through the job-wide environment file. The 3.14 phase still runs when the
# 3.9 phase fails (but not after cancellation), and the final step fails the
# job unless both phases passed every check. "Verifier failure-path checks"
# enforces this structure.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source (3.9)
        id: checkout_39
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          path: src-3.9
          fetch-depth: 0
          persist-credentials: false
      - name: Source revision (3.9)
        id: revision_39
        working-directory: src-3.9
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail() { echo "::error::source revision check failed: $1"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "expected SHA is not a full commit id"
          head=$(git rev-parse HEAD) || fail "cannot read HEAD"
          test "$head" = "$EXPECTED_SHA" || fail "checked out $head, expected $EXPECTED_SHA"
          echo "tested source HEAD: $head ($GITHUB_EVENT_NAME)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$head" != "$GITHUB_SHA" || fail "checked out the merge ref instead of the PR head"
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "missing PR base SHA"
            if git merge-base --is-ancestor "$BASE_SHA" "$head"; then
              echo "merge coverage: head contains base $BASE_SHA, so the merge result tree is the tested tree"
            else
              test $? -eq 1 || fail "cannot compare head with base"
              echo "::warning::PR head does not contain base $BASE_SHA: the merge result is NOT tested by this run. Update the branch before merging; post-merge main CI tests the merged commit."
            fi
          fi
      - name: Set up Python (3.9)
        id: setup_39
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: '3.9'
      # The trusted-runtime check (wire.file_hash) refuses an interpreter that
      # group/other can rewrite; some runner-image tool caches ship 0777. Run
      # on a job-owned copy instead of weakening the check or chmod-ing the
      # shared tool cache, and prove the copy is byte-identical.
      - name: Job-owned verified Python (3.9)
        id: runtime_39
        env:
          PHASE: '3.9'
          PYTHON_SRC: ${{ steps.setup_39.outputs.python-path }}
        run: |
          fail() { echo "::error::job-owned Python check failed: $1"; exit 1; }
          [[ "$PHASE" =~ ^3\.(9|14)$ ]] || fail "unknown interpreter phase"
          src="$("$PYTHON_SRC" -c 'import sys; print(sys.base_prefix)')" || fail "cannot query interpreter"
          src_exe="$("$PYTHON_SRC" -c 'import os,sys; print(os.path.realpath(sys.executable))')" || fail "cannot query interpreter"
          dst="$RUNNER_TEMP/job-python-$PHASE"
          test ! -e "$dst" || fail "runtime root already exists"
          cp -a "$src" "$dst"
          chmod -R go-w "$dst"
          exe="$dst/${src_exe#"$src"/}"
          { test -f "$exe" && test ! -L "$exe"; } || fail "interpreter is not a regular file"
          test "$(stat -c %u "$exe")" = "$(id -u)" || fail "interpreter not owned by job user"
          test $(( 0$(stat -c %a "$exe") & 022 )) -eq 0 || fail "interpreter group/other writable"
          # Scan physical entries only; external symlink targets are not checked.
          # setup-python/cache libraries (including LD_LIBRARY_PATH) remain trusted;
          # executable verification does not prove full relocated runtime integrity.
          # BEGIN status-checked verification
          inventory=$(find "$dst" ! -type l -perm /022 -print -quit) || fail "cannot scan copy"
          test -z "$inventory" || fail "writable file left in copy"
          copy_hash=$(sha256sum < "$exe") || fail "cannot hash copy"
          source_hash=$(sha256sum < "$src_exe") || fail "cannot hash source"
          [[ "$copy_hash" =~ ^[0-9a-f]{64}[[:space:]][[:space:]]-$ ]] || fail "invalid copy hash"
          [[ "$source_hash" =~ ^[0-9a-f]{64}[[:space:]][[:space:]]-$ ]] || fail "invalid source hash"
          test "$copy_hash" = "$source_hash" || fail "interpreter bytes differ"
          # END status-checked verification
          DST="$dst" "$exe" -c 'import os,sys; assert os.path.realpath(sys.executable).startswith(os.environ["DST"] + os.sep)' \
            || fail "copy does not run from its own runtime root"
          PHASE="$PHASE" "$exe" -c 'import os,sys; assert "%d.%d" % sys.version_info[:2] == os.environ["PHASE"]' \
            || fail "interpreter is not Python $PHASE"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
      - name: Install llmtool (3.9)
        id: install_39
        working-directory: src-3.9
        env:
          JOB_PYTHON: ${{ steps.runtime_39.outputs.exe }}
        run: |
          "$JOB_PYTHON" -m pip install --requirement tools/llmtool/requirements-ci.txt
          "$JOB_PYTHON" -m pip install --no-deps -e tools/llmtool
      - name: Verifier failure-path checks (3.9)
        id: verifier_39
        working-directory: src-3.9
        env:
          JOB_PYTHON: ${{ steps.runtime_39.outputs.exe }}
        run: |
          "$JOB_PYTHON" -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/llmtool-ci.yml').read_text())
          steps = workflow['jobs']['check']['steps']

          # Workflow structure: both interpreters run the same complete checks,
          # the 3.14 phase is independent of a 3.9 failure, and the job fails
          # unless both phases pass.
          triggers = workflow[True]  # YAML 1.1 reads the 'on' key as True
          assert triggers['push']['branches'] == ['main'], 'push must be main-only'
          assert triggers['push']['paths'] == triggers['pull_request']['paths'], 'trigger paths differ'
          assert 'workflow_dispatch' in triggers, 'manual dispatch missing'
          job = workflow['jobs']['check']
          assert list(workflow['jobs']) == ['check'] and 'strategy' not in job, 'unexpected job layout'
          phases = {v: [s for s in steps if s.get('name', '').endswith(' (%s)' % v)] for v in ('3.9', '3.14')}
          first, second = phases['3.9'], phases['3.14']
          final = steps[-1]
          assert steps == first + second + [final], 'steps must be 3.9 phase, 3.14 phase, final gate'

          def shape(step):
              text = json.dumps({k: v for k, v in step.items() if k != 'if'}, sort_keys=True)
              for old, new in (('3.14', '{V}'), ('_314', '_{V}'), ('3.9', '{V}'), ('_39', '_{V}')):
                  text = text.replace(old, new)
              return text
          assert len(first) == 8 and [shape(s) for s in first] == [shape(s) for s in second], \
              'interpreter phases are not identical'
          assert all('if' not in s for s in first), '3.9 phase must use the default success() chain'
          def expr(text):  # built at runtime: GitHub expands literal expressions in run
              return '$' + '{{ ' + text + ' }}'
          previous = None
          for s in second:
              want = expr('!cancelled()' if previous is None else
                          "!cancelled() && steps.%s.outcome == 'success'" % previous)
              assert s.get('if') == want, s['name'] + ': 3.14 phase condition'
              previous = s['id']
          assert final.get('name') == 'Both interpreters passed' and final.get('if') == expr('always()')
          assert final['env'] == {'RESULT_39': expr('steps.clean_39.outcome'),
                                  'RESULT_314': expr('steps.clean_314.outcome')}, 'final gate inputs'
          assert first[-1]['id'] == 'clean_39' and second[-1]['id'] == 'clean_314'
          source = Path('.github/workflows/llmtool-ci.yml').read_text()
          assert 'GITHUB_' + 'ENV' not in source, 'state must not cross phases through the job environment'
          assert all('continue-on-error' not in s for s in steps), 'no step may hide a failure'
          print('Workflow structure checks: PASS')

          guards = [s['run'] for s in steps if s.get('name', '').startswith('Job-owned verified Python (')]
          assert len(guards) == 2 and guards[0] == guards[1], 'runtime guards must be identical'
          step = guards[0]
          guard = step.split('# BEGIN status-checked verification\n', 1)[1].split(
              '# END status-checked verification', 1)[0]
          fail = next(line for line in step.splitlines() if line.startswith('fail()'))
          # Run the actual guard, not a second implementation of its checks.
          second_hash_error = ('sha256sum() { if test -e "$dst/hash-called"; then return 2; '
                               'fi; : > "$dst/hash-called"; command sha256sum; }')
          second_hash_empty = ('sha256sum() { if test -e "$dst/hash-called"; then return 0; '
                               'fi; : > "$dst/hash-called"; command sha256sum; }')
          cases = [
              ('regular flow', '', None, None),
              ('find error with empty stdout', 'find() { return 2; }', None, 'cannot scan copy'),
              ('writable entry', '', 'writable', 'writable file left in copy'),
              ('both hash tools fail', 'sha256sum() { return 2; }', None, 'cannot hash copy'),
              ('source hash tool fails', second_hash_error, None, 'cannot hash source'),
              ('copy hash empty success', 'sha256sum() { return 0; }', None, 'invalid copy hash'),
              ('source hash empty success', second_hash_empty, None, 'invalid source hash'),
              ('malformed hash', "sha256sum() { printf 'invalid\\n'; }", None, 'invalid copy hash'),
              ('different bytes', '', 'different', 'interpreter bytes differ'),
              ('copy unreadable', '', 'copy unreadable', 'cannot hash copy'),
              ('source unreadable', '', 'source unreadable', 'cannot hash source'),
              ('both unreadable', '', 'both unreadable', 'cannot hash copy'),
          ]
          if os.geteuid() == 0:
              raise RuntimeError('read-failure probes require an unprivileged job')
          for label, override, mutation, expected in cases:
              with tempfile.TemporaryDirectory(prefix='wf87-verifier-') as temporary:
                  root = Path(temporary)
                  dst = root / 'copy'
                  dst.mkdir()
                  exe, source = dst / 'python', root / 'source-python'
                  for path in (exe, source):
                      path.write_bytes(b'identical synthetic interpreter bytes\n')
                      path.chmod(0o600)
                  if mutation == 'writable':
                      (dst / 'writable').write_bytes(b'fixture')
                      (dst / 'writable').chmod(0o666)
                  if mutation == 'different':
                      source.write_bytes(b'different synthetic interpreter bytes\n')
                  unreadable = {'copy unreadable': (exe,), 'source unreadable': (source,),
                                'both unreadable': (exe, source)}.get(mutation, ())
                  for path in unreadable:
                      path.chmod(0o111)
                  try:
                      result = subprocess.run(
                          ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c',
                           fail + '\n' + override + '\n' + guard],
                          env={**os.environ, 'dst': str(dst), 'exe': str(exe),
                               'src_exe': str(source)}, capture_output=True, text=True, timeout=10)
                      if expected is None:
                          assert result.returncode == 0, label
                      else:
                          assert result.returncode == 1, label
                          assert 'job-owned Python check failed: ' + expected in result.stdout, label
                          if unreadable:
                              assert 'Permission denied' in result.stderr, label
                      print(label + ': PASS')
                  finally:
                      for path in unreadable:
                          path.chmod(0o600)
          print('Verifier checks: 12/12 PASS; no skips')
          PY
      - name: Offline canonical checks (3.9)
        id: suite_39
        working-directory: src-3.9
        timeout-minutes: 13
        env:
          PHASE: '3.9'
          JOB_PYTHON: ${{ steps.runtime_39.outputs.exe }}
        run: |
          if [ "$INJECT_FAILURE" = "$PHASE" ]; then
            echo "::error::workflow_dispatch fail-closed self-test: injected Python $PHASE failure"
            exit 1
          fi
          make -C tools/llmtool check PYTHON="$JOB_PYTHON"
      - name: Working tree is clean (3.9)
        id: clean_39
        working-directory: src-3.9
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "::error::the CI run changed tracked files or left untracked files:"
            printf '%s\n' "$status"
            exit 1
          fi
          echo "working tree clean"

      - name: Checkout source (3.14)
        id: checkout_314
        if: ${{ !cancelled() }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          path: src-3.14
          fetch-depth: 0
          persist-credentials: false
      - name: Source revision (3.14)
        id: revision_314
        if: ${{ !cancelled() && steps.checkout_314.outcome == 'success' }}
        working-directory: src-3.14
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail() { echo "::error::source revision check failed: $1"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "expected SHA is not a full commit id"
          head=$(git rev-parse HEAD) || fail "cannot read HEAD"
          test "$head" = "$EXPECTED_SHA" || fail "checked out $head, expected $EXPECTED_SHA"
          echo "tested source HEAD: $head ($GITHUB_EVENT_NAME)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$head" != "$GITHUB_SHA" || fail "checked out the merge ref instead of the PR head"
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "missing PR base SHA"
            if git merge-base --is-ancestor "$BASE_SHA" "$head"; then
              echo "merge coverage: head contains base $BASE_SHA, so the merge result tree is the tested tree"
            else
              test $? -eq 1 || fail "cannot compare head with base"
              echo "::warning::PR head does not contain base $BASE_SHA: the merge result is NOT tested by this run. Update the branch before merging; post-merge main CI tests the merged commit."
            fi
          fi
      - name: Set up Python (3.14)
        id: setup_314
        if: ${{ !cancelled() && steps.revision_314.outcome == 'success' }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: '3.14'
      - name: Job-owned verified Python (3.14)
        id: runtime_314
        if: ${{ !cancelled() && steps.setup_314.outcome == 'success' }}
        env:
          PHASE: '3.14'
          PYTHON_SRC: ${{ steps.setup_314.outputs.python-path }}
        run: |
          fail() { echo "::error::job-owned Python check failed: $1"; exit 1; }
          [[ "$PHASE" =~ ^3\.(9|14)$ ]] || fail "unknown interpreter phase"
