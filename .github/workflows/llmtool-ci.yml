              for old, new in (('3.14', '{V}'), ('_314', '_{V}'), ('3.9', '{V}'), ('_39', '_{V}')):
                  text = text.replace(old, new)
              return text
          assert len(first) == 8 and [shape(s) for s in first] == [shape(s) for s in second], \
