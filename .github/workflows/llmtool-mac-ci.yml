name: llmtool Mac CI

# Feature branches are tested through their pull request, not again on push:
# a branch push plus its PR used to run the same commit twice (Issue #99).
# main keeps its post-merge run; workflow_dispatch is the manual check for a
# ref without a PR. Jobs run on the Owner's Mac as the dedicated non-admin
# account from tools/mac-runner (installed outside the repo, so a PR cannot
# turn it off); its job-started hook fails any job from a runner running as
# the Owner, a fork or an untrusted actor. MAC_CI_ENABLED is the kill switch:
# anything but 'true' skips the job, and a skipped job is NOT_RUN, not PASS.
on:
  push:
    branches:
      - main
    # Skip top-level llmtool docs; deeper .md files remain included for runtime skills.
    paths:
      - 'tools/llmtool/**'
      - '!tools/llmtool/*.md'
      - 'scripts/llmtool_monitor.py'
      - 'scripts/test_llmtool_monitor.py'
      - '.github/workflows/llmtool-mac-ci.yml'
      - 'tools/mac-runner/**'
  pull_request:
    # Skip top-level llmtool docs; deeper .md files remain included for runtime skills.
    paths:
      - 'tools/llmtool/**'
      - '!tools/llmtool/*.md'
      - 'scripts/llmtool_monitor.py'
      - 'scripts/test_llmtool_monitor.py'
      - '.github/workflows/llmtool-mac-ci.yml'
      - 'tools/mac-runner/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (macOS 3.13)
    if: vars.MAC_CI_ENABLED == 'true'
    runs-on: [self-hosted, macOS, X64, local-mac-ci]
    timeout-minutes: 30
    steps:
      # Test the PR's own head commit, not GitHub's temporary merge commit
      # (GITHUB_SHA), so a run is exact evidence for the SHA it reports.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Without the merge ref, merge coverage holds only if the head already
      # contains the PR base; otherwise fail rather than pass untested. The
      # base is fixed at event time, so the merge itself must still recheck
      # live main and bind to this head (Issue #99 / PR #100).
      - name: Source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail() { echo "::error::source revision check failed: $1"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "expected SHA is not a full commit id"
          head=$(git rev-parse HEAD) || fail "cannot read HEAD"
          test "$head" = "$EXPECTED_SHA" || fail "checked out $head, expected $EXPECTED_SHA"
          echo "tested source HEAD: $head ($GITHUB_EVENT_NAME)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$head" != "$GITHUB_SHA" || fail "checked out the merge ref instead of the PR head"
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "missing PR base SHA"
            if git merge-base --is-ancestor "$BASE_SHA" "$head"; then
              echo "merge coverage: head contains base $BASE_SHA"
            else
              status=$?
              test "$status" -eq 1 || fail "cannot compare head with base $BASE_SHA"
              fail "head does not contain base $BASE_SHA; update the branch so CI tests the merge result"
            fi
          fi
      # PRs use the committed Mac baseline plus tests for changed modules.
      # Monitor-only changes retain their existing lightweight path. Empty,
      # unknown, failed, and non-PR comparisons use full checks.
      - name: Coverage mode
        id: coverage
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mode=full
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            paths="$RUNNER_TEMP/changed-paths"
            if git diff --no-ext-diff --no-renames --name-only -z "$BASE_SHA" "$EXPECTED_SHA" -- > "$paths"; then
              count=0
              mode=monitor-only
              while IFS= read -r -d '' path; do
                count=$((count + 1))
                case "$path" in
                  scripts/llmtool_monitor.py|scripts/test_llmtool_monitor.py) ;;
                  *) mode=mac-subset ;;
                esac
              done < "$paths"
              if [ "$count" -eq 0 ]; then
                mode=full
              fi
              if [ "$mode" = mac-subset ]; then
                selection=$(python3 tools/llmtool/scripts/ci_mac_modules.py --changed-paths "$paths") || mode=full
                if [ "$mode" = mac-subset ]; then
                  if [ "$selection" = FULL ]; then
                    mode=full
                  else
                    printf '%s\n' "$selection" > "$RUNNER_TEMP/mac-modules"
                  fi
                fi
              fi
            fi
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          echo "coverage mode: $mode"
      # Use the Mac's Python 3.13 in a job-owned venv with a copied executable.
      # The trusted-runtime check refuses a group/other-writable interpreter;
      # the copy is checked byte-for-byte without changing the shared Python.
      - name: Job-owned verified Python
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
          src_exe="$(python3 -c 'import os,sys; print(os.path.realpath(sys.executable))')"
          dst="$RUNNER_TEMP/job-python"
          python3 -m venv --copies "$dst"
          chmod -R go-w "$dst"
          exe="$dst/bin/python3"
          fail() { echo "::error::job-owned Python check failed: $1"; exit 1; }
          { test -f "$exe" && test ! -L "$exe"; } || fail "interpreter is not a regular file"
          test "$(stat -f %u "$exe")" = "$(id -u)" || fail "interpreter not owned by job user"
          test $(( 0$(stat -f %Lp "$exe") & 022 )) -eq 0 || fail "interpreter group/other writable"
          # Scan physical entries only; the shared base runtime and libraries
          # remain part of the audited Mac runner trust boundary.
          # BEGIN status-checked verification
          inventory=$(find "$dst" ! -type l \( -perm -020 -o -perm -002 \) -print -quit) || fail "cannot scan copy"
          test -z "$inventory" || fail "writable file left in copy"
          copy_hash=$(shasum -a 256 < "$exe") || fail "cannot hash copy"
          source_hash=$(shasum -a 256 < "$src_exe") || fail "cannot hash source"
          [[ "$copy_hash" =~ ^[0-9a-f]{64}[[:space:]][[:space:]]-$ ]] || fail "invalid copy hash"
          [[ "$source_hash" =~ ^[0-9a-f]{64}[[:space:]][[:space:]]-$ ]] || fail "invalid source hash"
          test "$copy_hash" = "$source_hash" || fail "interpreter bytes differ"
          # END status-checked verification
          "$exe" -c 'import os,sys; root=os.path.realpath(os.environ["RUNNER_TEMP"]); assert os.path.commonpath((root,os.path.realpath(sys.executable)))==root' \
            || fail "copy does not run from RUNNER_TEMP"
          echo "JOB_PYTHON=$exe" >> "$GITHUB_ENV"
      - name: Install llmtool
        run: |
          "$JOB_PYTHON" -m pip install --requirement tools/llmtool/requirements-ci.txt
          "$JOB_PYTHON" -m pip install --no-deps -e tools/llmtool
      - name: Verifier failure-path checks
        run: |
          "$JOB_PYTHON" -B - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/llmtool-mac-ci.yml').read_text())
          step = next(s for s in workflow['jobs']['check']['steps']
                      if s.get('name') == 'Job-owned verified Python')['run']
          guard = step.split('# BEGIN status-checked verification\n', 1)[1].split(
              '# END status-checked verification', 1)[0]
          fail = next(line for line in step.splitlines() if line.startswith('fail()'))
          # Run the actual guard, not a second implementation of its checks.
          second_hash_error = ('shasum() { if test -e "$dst/hash-called"; then return 2; '
                               'fi; : > "$dst/hash-called"; command shasum "$@"; }')
          second_hash_empty = ('shasum() { if test -e "$dst/hash-called"; then return 0; '
                               'fi; : > "$dst/hash-called"; command shasum "$@"; }')
          cases = [
              ('regular flow', '', None, None),
              ('find error with empty stdout', 'find() { return 2; }', None, 'cannot scan copy'),
              ('writable entry', '', 'writable', 'writable file left in copy'),
              ('both hash tools fail', 'shasum() { return 2; }', None, 'cannot hash copy'),
              ('source hash tool fails', second_hash_error, None, 'cannot hash source'),
              ('copy hash empty success', 'shasum() { return 0; }', None, 'invalid copy hash'),
              ('source hash empty success', second_hash_empty, None, 'invalid source hash'),
              ('malformed hash', "shasum() { printf 'invalid\\n'; }", None, 'invalid copy hash'),
              ('different bytes', '', 'different', 'interpreter bytes differ'),
              ('copy unreadable', '', 'copy unreadable', 'cannot hash copy'),
              ('source unreadable', '', 'source unreadable', 'cannot hash source'),
              ('both unreadable', '', 'both unreadable', 'cannot hash copy'),
          ]
          if os.geteuid() == 0:
              raise RuntimeError('read-failure probes require an unprivileged job')
          for label, override, mutation, expected in cases:
              with tempfile.TemporaryDirectory(prefix='wf87-verifier-') as temporary:
                  root = Path(temporary)
                  dst = root / 'copy'
                  dst.mkdir()
                  exe, source = dst / 'python', root / 'source-python'
                  for path in (exe, source):
                      path.write_bytes(b'identical synthetic interpreter bytes\n')
                      path.chmod(0o600)
                  if mutation == 'writable':
                      (dst / 'writable').write_bytes(b'fixture')
                      (dst / 'writable').chmod(0o666)
                  if mutation == 'different':
                      source.write_bytes(b'different synthetic interpreter bytes\n')
                  unreadable = {'copy unreadable': (exe,), 'source unreadable': (source,),
                                'both unreadable': (exe, source)}.get(mutation, ())
                  for path in unreadable:
                      path.chmod(0o111)
                  try:
                      result = subprocess.run(
                          ['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c',
                           fail + '\n' + override + '\n' + guard],
                          env={**os.environ, 'dst': str(dst), 'exe': str(exe),
                               'src_exe': str(source)}, capture_output=True, text=True, timeout=10)
                      if expected is None:
                          assert result.returncode == 0, label
                      else:
                          assert result.returncode == 1, label
                          assert 'job-owned Python check failed: ' + expected in result.stdout, label
                          if unreadable:
                              assert 'Permission denied' in result.stderr, label
                      print(label + ': PASS')
                  finally:
                      for path in unreadable:
                          path.chmod(0o600)
          print('Verifier checks: 12/12 PASS; no skips')
          PY
      - name: Offline canonical checks
        if: steps.coverage.outputs.mode != 'monitor-only'
        run: |
          if [ "${{ steps.coverage.outputs.mode }}" = mac-subset ]; then
            make -C tools/llmtool syntax PYTHON="$JOB_PYTHON"
            while IFS= read -r module; do
              "$JOB_PYTHON" -m unittest discover -s tools/llmtool/tests -p "$module.py" -v
            done < "$RUNNER_TEMP/mac-modules"
          else
            make -C tools/llmtool check PYTHON="$JOB_PYTHON"
          fi
      - name: Monitor script checks
        run: |
          "$JOB_PYTHON" -B -m unittest discover -s scripts
      - name: Working tree is clean
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "::error::the CI run changed tracked files or left untracked files:"
            printf '%s\n' "$status"
            exit 1
          fi
          echo "working tree clean"
