name: api-agent-gateway CI

on:
  pull_request:
    paths:
      - 'tools/api-agent-gateway/**'
      - '.github/workflows/api-agent-gateway-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/api-agent-gateway/**'
      - '.github/workflows/api-agent-gateway-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gateway-tests:
    name: gateway tests (Linux 3.14)
    runs-on: [self-hosted, Linux, X64, local-ec2-linux-ci]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/api-agent-gateway
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.14
        shell: bash
        run: |
          python=/usr/bin/python3.14
          test -x "$python" || { echo "::error::no $python on this runner"; exit 1; }
          "$python" -B - <<'PY'
          import sys

          if '%d.%d' % sys.version_info[:2] != '3.14':
              raise SystemExit('expected Python 3.14, got ' + sys.version.split()[0])
          print('Python ' + sys.version.split()[0])
          PY

      - name: Source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail() { echo "::error::source revision check failed: $1"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "expected SHA is not a full commit id"
          head=$(git rev-parse HEAD) || fail "cannot read HEAD"
          test "$head" = "$EXPECTED_SHA" || fail "checked out $head, expected $EXPECTED_SHA"
          echo "tested source HEAD: $head ($GITHUB_EVENT_NAME)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$head" != "$GITHUB_SHA" || fail "checked out the merge ref instead of the PR head"
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "missing PR base SHA"
            if git merge-base --is-ancestor "$BASE_SHA" "$head"; then
              echo "merge coverage: head contains base $BASE_SHA"
            else
              status=$?
              test "$status" -eq 1 || fail "cannot compare head with base $BASE_SHA"
              fail "head does not contain base $BASE_SHA; update the branch so CI tests the merge result"
            fi
          fi

      - name: Offline gateway tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: /usr/bin/python3.14 -B -m unittest discover -s tests -v
