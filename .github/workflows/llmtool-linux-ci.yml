name: llmtool Linux CI

# Linux Python CI on GitHub-hosted ubuntu-24.04 (#1253, Owner 2026-11-09: the
# repository is public; the EC2 self-hosted runners no longer take CI jobs).
# 3.14, the daily Linux version, runs the full offline suite on every PR and
# main push. 3.9, the oldest pyproject.toml declares (requires-python >=3.9),
# runs only before a release: start this workflow by hand on main with
# `python39` (Owner 2026-10-25). Python comes from actions/setup-python
# (pinned by SHA) into a job-owned venv. The hosted-runner boundary step checks
# that the job runs on a GitHub-hosted runner, not as root, with no cloud
# credential environment. Only the Owner and the AI machine account trigger
# jobs; fork PRs also need Owner approval in the repository settings. The
# company LLM, its VPN and any company configuration are never used here; all
# tests are offline. HOSTED_CI_ENABLED is the kill switch: anything but 'true'
# skips the jobs (LINUX_CI_ENABLED, the old self-hosted switch, stays 'false' so
# older self-hosted copies of this file on other branches never run), and a skipped job is NOT_RUN, not PASS. Windows is not
# covered here (NOT_RUN).
on:
  push:
    branches:
      - main
    # Top-level llmtool Markdown triggers docs validation only; deeper paths remain included.
    paths:
      - 'tools/llmtool/**'
      - '!tools/llmtool/*.md'
      - '.github/workflows/llmtool-linux-ci.yml'
      - 'tools/ec2-runner/**'
      - 'tools/safe-git/**'
      - 'tools/api-agent-gateway/**'
      - 'tools/ai-loop/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'skills/**'
      - 'docs/**'
      - 'tools/llmtool/*.md'
      - '*.md'
      - 'scripts/**'
      - '.github/workflows/**'
      # '*.md' matches only top-level files, so Markdown in reports/ and other folders got no docs check.
      - '**/*.md'
      - 'reports/**'
  pull_request:
    # Top-level llmtool Markdown triggers docs validation only; deeper paths remain included.
    paths:
      - 'tools/llmtool/**'
      - '!tools/llmtool/*.md'
      - '.github/workflows/llmtool-linux-ci.yml'
      - 'tools/ec2-runner/**'
      - 'tools/safe-git/**'
      - 'tools/api-agent-gateway/**'
      - 'tools/ai-loop/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'skills/**'
      - 'docs/**'
      - 'tools/llmtool/*.md'
      - '*.md'
      - 'scripts/**'
      - '.github/workflows/**'
      # '*.md' matches only top-level files, so Markdown in reports/ and other folders got no docs check.
      - '**/*.md'
      - 'reports/**'
  workflow_dispatch:
    inputs:
      python39:
        description: 'Pre-release check: also run the full suite on Python 3.9'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changed paths
    if: >-
      vars.HOSTED_CI_ENABLED == 'true'
      && github.repository == 'davidcatcat/davidcattoolsproject'
      && (github.actor == 'davidcatcat' || github.actor == 'ddavidccatssun')
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
      gateway: ${{ steps.classify.outputs.gateway }}
      ai_loop: ${{ steps.classify.outputs.ai_loop }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          code=false
          docs=false
          gateway=false
          ai_loop=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            paths="$RUNNER_TEMP/changed-paths"
            git diff --no-ext-diff --no-renames --name-only -z "$BASE_SHA" "$EXPECTED_SHA" -- > "$paths"
            flags=$(python3 -I -B tools/llmtool/scripts/ci_path_classes.py --linux-flags "$paths")
            read -r code docs gateway ai_loop <<< "$flags"
          else
            code=true
            docs=true
            if [ -d tools/api-agent-gateway ]; then gateway=true; fi
            if [ -d tools/ai-loop ]; then ai_loop=true; fi
          fi
          printf 'code=%s\ndocs=%s\ngateway=%s\nai_loop=%s\n' "$code" "$docs" "$gateway" "$ai_loop" >> "$GITHUB_OUTPUT"

  ai-loop:
    name: ai-loop helper tests (Python 3.14)
    needs: changes
    if: >-
      vars.HOSTED_CI_ENABLED == 'true'
      && github.repository == 'davidcatcat/davidcattoolsproject'
      && (github.actor == 'davidcatcat' || github.actor == 'ddavidccatssun')
      && needs.changes.outputs.ai_loop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.14'
      - name: Offline ai-loop helper tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SETUP_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "$SETUP_PYTHON" -B -m unittest discover -s tools/ai-loop

  gateway:
    name: gateway tests (Linux 3.14)
    needs: changes
    if: >-
      vars.HOSTED_CI_ENABLED == 'true'
      && github.repository == 'davidcatcat/davidcattoolsproject'
      && (github.actor == 'davidcatcat' || github.actor == 'ddavidccatssun')
      && needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check GitHub-hosted runner boundary
        shell: bash
        run: |
          fail() { echo "::error::hosted runner boundary failed: $1"; exit 1; }
          test "$RUNNER_ENVIRONMENT" = github-hosted || fail "not a GitHub-hosted runner"
          test "$(id -u)" -ne 0 || fail "job runs as root"
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN \
                      AWS_WEB_IDENTITY_TOKEN_FILE AWS_SHARED_CREDENTIALS_FILE GW_AGENT_API_KEY; do
            test -z "${!name+x}" || fail "credential environment $name present"
          done
          echo "Runner: $RUNNER_NAME ($RUNNER_ENVIRONMENT, $RUNNER_OS $RUNNER_ARCH); user: $(id -un)"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.14'
      - name: Verify Python 3.14
        shell: bash
        env:
          SETUP_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          python=$SETUP_PYTHON
          test -x "$python" || { echo "::error::no $python on this runner"; exit 1; }
          "$python" -B - <<'PY'
          import sys

          if '%d.%d' % sys.version_info[:2] != '3.14':
              raise SystemExit('expected Python 3.14, got ' + sys.version.split()[0])
          print('Python ' + sys.version.split()[0])
          PY

      - name: Source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail() { echo "::error::source revision check failed: $1"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "expected SHA is not a full commit id"
          head=$(git rev-parse HEAD) || fail "cannot read HEAD"
          test "$head" = "$EXPECTED_SHA" || fail "checked out $head, expected $EXPECTED_SHA"
          echo "tested source HEAD: $head ($GITHUB_EVENT_NAME)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$head" != "$GITHUB_SHA" || fail "checked out the merge ref instead of the PR head"
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "missing PR base SHA"
            if git merge-base --is-ancestor "$BASE_SHA" "$head"; then
              echo "merge coverage: head contains base $BASE_SHA"
            else
              status=$?
              test "$status" -eq 1 || fail "cannot compare head with base $BASE_SHA"
              echo "::notice::head does not contain base $BASE_SHA; CI tested the exact PR head (loose merge rule, Issue #1317); the merge gate checks GitHub mergeability"
            fi
          fi

      - name: Offline gateway tests
        working-directory: tools/api-agent-gateway
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SETUP_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "$SETUP_PYTHON" -B -m unittest discover -s tests -v

  shards:
    name: linux shard ${{ matrix.shard }}/3 (${{ matrix.python }})
    if: >-
      vars.HOSTED_CI_ENABLED == 'true'
      && github.repository == 'davidcatcat/davidcattoolsproject'
      && (github.actor == 'davidcatcat' || github.actor == 'ddavidccatssun')
      && (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python39 && '["3.14", "3.9"]' || '["3.14"]') }}
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      # Trusted inline checks only, before any repository code is checked out.
      - name: Check GitHub-hosted runner boundary
        shell: bash
        run: |
          fail() { echo "::error::hosted runner boundary failed: $1"; exit 1; }
          test "$RUNNER_ENVIRONMENT" = github-hosted || fail "not a GitHub-hosted runner"
          test "$(id -u)" -ne 0 || fail "job runs as root"
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN \
                      AWS_WEB_IDENTITY_TOKEN_FILE AWS_SHARED_CREDENTIALS_FILE GW_AGENT_API_KEY; do
            test -z "${!name+x}" || fail "credential environment $name present"
          done
          echo "Runner: $RUNNER_NAME ($RUNNER_ENVIRONMENT, $RUNNER_OS $RUNNER_ARCH); user: $(id -un)"
      # Test the PR's own head commit, not GitHub's temporary merge commit, as
      # the Mac CI does, so a run is exact evidence for the SHA it reports.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail() { echo "::error::source revision check failed: $1"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "expected SHA is not a full commit id"
          head=$(git rev-parse HEAD) || fail "cannot read HEAD"
          test "$head" = "$EXPECTED_SHA" || fail "checked out $head, expected $EXPECTED_SHA"
          echo "tested source HEAD: $head ($GITHUB_EVENT_NAME)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$head" != "$GITHUB_SHA" || fail "checked out the merge ref instead of the PR head"
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "missing PR base SHA"
            if git merge-base --is-ancestor "$BASE_SHA" "$head"; then
              echo "merge coverage: head contains base $BASE_SHA"
            else
              status=$?
              test "$status" -eq 1 || fail "cannot compare head with base $BASE_SHA"
              echo "::notice::head does not contain base $BASE_SHA; CI tested the exact PR head (loose merge rule, Issue #1317); the merge gate checks GitHub mergeability"
            fi
          fi
      # A job-owned venv in RUNNER_TEMP, built from the setup-python interpreter.
      # setuptools is pinned to meet pyproject's build requirement (>=68), so
      # the wheel/sdist packaging test runs on both versions: 3.9's bundled
      # setuptools is too old and 3.14's venv has none.
      - name: Set up Python ${{ matrix.python }}
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '${{ matrix.python }}'
      - name: Install llmtool
        shell: bash
        env:
          SETUP_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "$SETUP_PYTHON" -c 'import os,sys; assert "%d.%d" % sys.version_info[:2] == os.environ["PYTHON_VERSION"], sys.version'
          "$SETUP_PYTHON" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet setuptools==80.9.0
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --requirement tools/llmtool/requirements-ci.txt
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --no-deps -e tools/llmtool
          echo "JOB_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - name: Offline test shard
        shell: bash
        run: |
          make -C tools/llmtool syntax PYTHON="$JOB_PYTHON"
          modules=$("$JOB_PYTHON" tools/llmtool/scripts/ci_test_shards.py 3 "${{ matrix.shard }}")
          while IFS= read -r module; do
            [ -n "$module" ] || continue
            "$JOB_PYTHON" -m unittest discover -s tools/llmtool/tests -p "$module" < /dev/null
          done <<< "$modules"
      - name: Host admission checks
        if: matrix.shard == 1
        run: |
          "$JOB_PYTHON" -B -m unittest discover -s tools/ec2-runner -p 'test_*.py'
      - name: Safe-git preflight tests
        if: matrix.shard == 1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$JOB_PYTHON" -B -m unittest discover -s tools/safe-git -p test_preflight.py
      # Audit #1174 found monitor PRs merged with no Linux job; Python 3.9 is
      # skipped because it is a manual pre-release check; it runs before the
      # clean-tree check so leftover files fail the job.
      - name: Repository script tests
        if: matrix.shard == 1 && matrix.python == '3.14'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$JOB_PYTHON" -B -m unittest discover -s scripts -p 'test_*.py' < /dev/null
          folders=$(find skills -name 'test_*.py' -exec dirname {} + | sort -u)
          if [ -z "$folders" ]; then
            echo "nothing to run"
            exit 0
          fi
          for folder in $folders; do
            "$JOB_PYTHON" -B -m unittest discover -s "$folder" -p 'test_*.py' < /dev/null
          done
      - name: Working tree is clean
        shell: bash
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "::error::the CI run changed tracked files or left untracked files:"
            printf '%s\n' "$status"
            exit 1
          fi
          echo "working tree clean"

  check:
    name: check (Linux ${{ matrix.python }})
    needs: [changes, shards]
    if: >-
      always()
      && vars.HOSTED_CI_ENABLED == 'true'
      && github.repository == 'davidcatcat/davidcattoolsproject'
      && (github.actor == 'davidcatcat' || github.actor == 'ddavidccatssun')
      && (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python39 && '["3.14", "3.9"]' || '["3.14"]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Linux shard to pass
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::Linux shard matrix result: $SHARDS_RESULT"
            exit 1
          fi
          echo "all Linux shards passed"

  docs:
    name: check (docs)
    needs: changes
    if: >-
      needs.changes.outputs.docs == 'true'
      && vars.HOSTED_CI_ENABLED == 'true'
      && github.repository == 'davidcatcat/davidcattoolsproject'
      && (github.actor == 'davidcatcat' || github.actor == 'ddavidccatssun')
    runs-on: ubuntu-24.04
    steps:
      # Trusted inline checks before checkout, identical to the shards.
      - name: Check GitHub-hosted runner boundary
        shell: bash
        run: |
          fail() { echo "::error::hosted runner boundary failed: $1"; exit 1; }
          test "$RUNNER_ENVIRONMENT" = github-hosted || fail "not a GitHub-hosted runner"
          test "$(id -u)" -ne 0 || fail "job runs as root"
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN \
                      AWS_WEB_IDENTITY_TOKEN_FILE AWS_SHARED_CREDENTIALS_FILE GW_AGENT_API_KEY; do
            test -z "${!name+x}" || fail "credential environment $name present"
          done
          echo "Runner: $RUNNER_NAME ($RUNNER_ENVIRONMENT, $RUNNER_OS $RUNNER_ARCH); user: $(id -un)"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail() { echo "::error::source revision check failed: $1"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "expected SHA is not a full commit id"
          head=$(git rev-parse HEAD) || fail "cannot read HEAD"
          test "$head" = "$EXPECTED_SHA" || fail "checked out $head, expected $EXPECTED_SHA"
          echo "tested source HEAD: $head ($GITHUB_EVENT_NAME)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$head" != "$GITHUB_SHA" || fail "checked out the merge ref instead of the PR head"
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "missing PR base SHA"
            if git merge-base --is-ancestor "$BASE_SHA" "$head"; then
              echo "merge coverage: head contains base $BASE_SHA"
            else
              status=$?
              test "$status" -eq 1 || fail "cannot compare head with base $BASE_SHA"
              echo "::notice::head does not contain base $BASE_SHA; CI tested the exact PR head (loose merge rule, Issue #1317); the merge gate checks GitHub mergeability"
            fi
          fi
      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.14'
      - name: Check changed Markdown
        env:
          SETUP_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "$SETUP_PYTHON" -I -B tools/llmtool/scripts/docs_check.py --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}" --head "${{ github.event.pull_request.head.sha || github.sha }}"
