name: llmtool Linux CI

# Linux Python CI on the Owner's EC2 (Issue #99): 3.14, the daily Linux
# version, runs the full offline suite on every PR and main push. 3.9, the
# oldest pyproject.toml declares (requires-python >=3.9), runs only before a
# release: start this workflow by hand on main with `python39` (Owner
# 2026-10-25). All three runners carry the same label, so each can take a job
# and three jobs run at the same time. Each runner runs under its own non-admin
# account with the instance metadata service blocked for its service; the
# root-owned job-started hook on the host
# (tools/ec2-runner, installed in /opt/llmtool-ci) refuses any job that is
# not this workflow, from the Owner, on this repository. The boundary step
# below is a second check, not the only one. LINUX_CI_ENABLED is the kill
# switch: anything but 'true' skips the jobs, and a skipped job is NOT_RUN,
# not PASS. Windows is not covered here (NOT_RUN).
on:
  push:
    branches:
      - main
    # Skip top-level llmtool docs; deeper .md files remain included for runtime skills.
    paths:
      - 'tools/llmtool/**'
      - '!tools/llmtool/*.md'
      - '.github/workflows/llmtool-linux-ci.yml'
      - 'tools/ec2-runner/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'skills/**'
      - 'docs/**'
      - 'tools/llmtool/*.md'
      - '*.md'
  pull_request:
    # Skip top-level llmtool docs; deeper .md files remain included for runtime skills.
    paths:
      - 'tools/llmtool/**'
      - '!tools/llmtool/*.md'
      - '.github/workflows/llmtool-linux-ci.yml'
      - 'tools/ec2-runner/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'skills/**'
      - 'docs/**'
      - 'tools/llmtool/*.md'
      - '*.md'
  workflow_dispatch:
    inputs:
      python39:
        description: 'Pre-release check: also run the full suite on Python 3.9'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changed paths
    if: >-
      vars.LINUX_CI_ENABLED == 'true'
      && github.repository == 'davidcatcat/davidcattoolsproject'
      && github.actor == 'davidcatcat'
    runs-on: [self-hosted, Linux, X64, local-ec2-linux-ci]
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          code=false
          docs=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            paths="$RUNNER_TEMP/changed-paths"
            git diff --no-ext-diff --no-renames --name-only -z "$BASE_SHA" "$EXPECTED_SHA" -- > "$paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md|AGENTS.md|CLAUDE.md|skills/*|docs/*|tools/llmtool/*.md) docs=true ;;
                *) code=true ;;
              esac
            done < "$paths"
          else
            code=true
            docs=true
          fi
          printf 'code=%s\ndocs=%s\n' "$code" "$docs" >> "$GITHUB_OUTPUT"

  shards:
    name: linux shard ${{ matrix.shard }}/3 (${{ matrix.python }})
    if: >-
      vars.LINUX_CI_ENABLED == 'true'
      && github.repository == 'davidcatcat/davidcattoolsproject'
      && github.actor == 'davidcatcat'
      && (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python39 && '["3.14", "3.9"]' || '["3.14"]') }}
        shard: [1, 2, 3]
    runs-on: [self-hosted, Linux, X64, local-ec2-linux-ci]
    timeout-minutes: 40
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      # Trusted inline checks only, before any repository code is checked out.
      - name: Check EC2 runner boundary
        shell: bash
        run: |
          fail() { echo "::error::EC2 runner boundary failed: $1"; exit 1; }
          case "$RUNNER_NAME" in
            ec2-self-runner) account=ghrunner ;;
            ec2-self-runner-2) account=ghrunner2 ;;
            ec2-self-runner-3) account=ghrunner3 ;;
            *) fail "unexpected runner" ;;
          esac
          user=$(id -un) || fail "cannot identify job user"
          test "$user" = "$account" || fail "runner $RUNNER_NAME runs as $user, expected $account"
          test "$(id -u)" -ne 0 || fail "job runs as root"
          groups=$(id -nG) || fail "cannot identify job groups"
          test "$groups" = "$account" || fail "job user has extra groups: $groups"
          python=/usr/bin/python$PYTHON_VERSION
          test -x "$python" || fail "no $python on this host"
          "$python" -B - <<'PY'
          import os
          from pathlib import Path
          import socket
          import sys

          if '%d.%d' % sys.version_info[:2] != os.environ['PYTHON_VERSION']:
              raise SystemExit('EC2 runner boundary failed: wrong Python')
          credential_names = (
              'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN',
              'AWS_WEB_IDENTITY_TOKEN_FILE', 'AWS_SHARED_CREDENTIALS_FILE',
          )
          if any(name in os.environ for name in credential_names):
              raise SystemExit('EC2 runner boundary failed: AWS credential environment present')
          if (Path.home() / '.aws').exists():
              raise SystemExit('EC2 runner boundary failed: job home has AWS configuration')
          for address in ('169.254.169.254', 'fd00:ec2::254'):
              try:
                  with socket.create_connection((address, 80), timeout=2):
                      raise SystemExit('EC2 runner boundary failed: instance metadata reachable')
              except OSError:
                  pass
          print('EC2_RUNNER_BOUNDARY_PASS Python ' + sys.version.split()[0])
          PY
          echo "Runner: $RUNNER_NAME; account: $user; architecture: $(uname -m)"
      # Test the PR's own head commit, not GitHub's temporary merge commit, as
      # the Mac CI does, so a run is exact evidence for the SHA it reports.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail() { echo "::error::source revision check failed: $1"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "expected SHA is not a full commit id"
          head=$(git rev-parse HEAD) || fail "cannot read HEAD"
          test "$head" = "$EXPECTED_SHA" || fail "checked out $head, expected $EXPECTED_SHA"
          echo "tested source HEAD: $head ($GITHUB_EVENT_NAME)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$head" != "$GITHUB_SHA" || fail "checked out the merge ref instead of the PR head"
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "missing PR base SHA"
            if git merge-base --is-ancestor "$BASE_SHA" "$head"; then
              echo "merge coverage: head contains base $BASE_SHA"
            else
              status=$?
              test "$status" -eq 1 || fail "cannot compare head with base $BASE_SHA"
              fail "head does not contain base $BASE_SHA; update the branch so CI tests the merge result"
            fi
          fi
      # A job-owned venv in RUNNER_TEMP; the host's Python is never changed.
      # setuptools is pinned to meet pyproject's build requirement (>=68), so
      # the wheel/sdist packaging test runs on both versions: 3.9's bundled
      # setuptools is too old and 3.14's venv has none.
      - name: Install llmtool
        shell: bash
        run: |
          "/usr/bin/python$PYTHON_VERSION" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet setuptools==80.9.0
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --requirement tools/llmtool/requirements-ci.txt
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --no-deps -e tools/llmtool
          echo "JOB_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - name: Offline test shard
        shell: bash
        run: |
          make -C tools/llmtool syntax PYTHON="$JOB_PYTHON"
          modules=$("$JOB_PYTHON" tools/llmtool/scripts/ci_test_shards.py 3 "${{ matrix.shard }}")
          while IFS= read -r module; do
            [ -n "$module" ] || continue
            "$JOB_PYTHON" -m unittest discover -s tools/llmtool/tests -p "$module" < /dev/null
          done <<< "$modules"
      - name: Host admission checks
        if: matrix.shard == 1
        run: |
          "$JOB_PYTHON" -B -m unittest discover -s tools/ec2-runner -p 'test_*.py'
      - name: Working tree is clean
        shell: bash
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "::error::the CI run changed tracked files or left untracked files:"
            printf '%s\n' "$status"
            exit 1
          fi
          echo "working tree clean"

  check:
    name: check (Linux ${{ matrix.python }})
    needs: [changes, shards]
    if: >-
      always()
      && vars.LINUX_CI_ENABLED == 'true'
      && github.repository == 'davidcatcat/davidcattoolsproject'
      && github.actor == 'davidcatcat'
      && (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python39 && '["3.14", "3.9"]' || '["3.14"]') }}
    runs-on: [self-hosted, Linux, X64, local-ec2-linux-ci]
    steps:
      - name: Require every Linux shard to pass
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::Linux shard matrix result: $SHARDS_RESULT"
            exit 1
          fi
          echo "all Linux shards passed"

  docs:
    name: check (docs)
    needs: changes
    if: >-
      needs.changes.outputs.docs == 'true'
      && vars.LINUX_CI_ENABLED == 'true'
      && github.repository == 'davidcatcat/davidcattoolsproject'
      && github.actor == 'davidcatcat'
    runs-on: [self-hosted, Linux, X64, local-ec2-linux-ci]
    steps:
      # Trusted inline checks before checkout, identical to the shards.
      - name: Check EC2 runner boundary
        shell: bash
        run: |
          fail() { echo "::error::EC2 runner boundary failed: $1"; exit 1; }
          case "$RUNNER_NAME" in
            ec2-self-runner) account=ghrunner ;;
            ec2-self-runner-2) account=ghrunner2 ;;
            ec2-self-runner-3) account=ghrunner3 ;;
            *) fail "unexpected runner" ;;
          esac
          user=$(id -un) || fail "cannot identify job user"
          test "$user" = "$account" || fail "runner $RUNNER_NAME runs as $user, expected $account"
          test "$(id -u)" -ne 0 || fail "job runs as root"
          groups=$(id -nG) || fail "cannot identify job groups"
          test "$groups" = "$account" || fail "job user has extra groups: $groups"
          python=/usr/bin/python3.14
          test -x "$python" || fail "no $python on this host"
          "$python" -B - <<'PY'
          import os
          from pathlib import Path
          import socket
          import sys
          if '%d.%d' % sys.version_info[:2] != '3.14':
              raise SystemExit('EC2 runner boundary failed: wrong Python')
          credential_names = ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN',
                              'AWS_WEB_IDENTITY_TOKEN_FILE', 'AWS_SHARED_CREDENTIALS_FILE')
          if any(name in os.environ for name in credential_names) or (Path.home() / '.aws').exists():
              raise SystemExit('EC2 runner boundary failed: AWS credential configuration present')
          for address in ('169.254.169.254', 'fd00:ec2::254'):
              try:
                  with socket.create_connection((address, 80), timeout=2):
                      raise SystemExit('EC2 runner boundary failed: instance metadata reachable')
              except OSError:
                  pass
          print('EC2_RUNNER_BOUNDARY_PASS Python ' + sys.version.split()[0])
          PY
          echo "Runner: $RUNNER_NAME; account: $user; architecture: $(uname -m)"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fail() { echo "::error::source revision check failed: $1"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "expected SHA is not a full commit id"
          head=$(git rev-parse HEAD) || fail "cannot read HEAD"
          test "$head" = "$EXPECTED_SHA" || fail "checked out $head, expected $EXPECTED_SHA"
          echo "tested source HEAD: $head ($GITHUB_EVENT_NAME)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$head" != "$GITHUB_SHA" || fail "checked out the merge ref instead of the PR head"
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "missing PR base SHA"
            if git merge-base --is-ancestor "$BASE_SHA" "$head"; then
              echo "merge coverage: head contains base $BASE_SHA"
            else
              status=$?
              test "$status" -eq 1 || fail "cannot compare head with base $BASE_SHA"
              fail "head does not contain base $BASE_SHA; update the branch so CI tests the merge result"
            fi
          fi
      - name: Check changed Markdown
        run: python3 -I -B tools/llmtool/scripts/docs_check.py --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}" --head "${{ github.event.pull_request.head.sha || github.sha }}"
